name: Validate inline JavaScript
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run backend lead-processing regression tests
        run: npm --prefix backend test
      - name: Extract inline scripts and syntax-check
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.script_type = ''
                  self.buf = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.in_script = True
                      self.external = any(k == 'src' for k, v in attrs)
                      self.script_type = next((v or '' for k, v in attrs if k == 'type'), '').lower()
                      self.buf = []
              def handle_data(self, data):
                  if self.in_script and not self.external and self.script_type in ('', 'text/javascript', 'application/javascript', 'module'):
                      self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      if not self.external and ''.join(self.buf).strip():
                          self.scripts.append(''.join(self.buf))
                      self.in_script = False
                      self.external = False
                      self.script_type = ''
                      self.buf = []
          parser = Scripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if not parser.scripts:
              raise SystemExit('No inline JavaScript found')
          for i, src in enumerate(parser.scripts):
              Path(f'/tmp/inline_{i}.mjs').write_text(src, encoding='utf-8')
          print(f'Extracted {len(parser.scripts)} inline script(s)')
          PY
          for f in /tmp/inline_*.mjs; do node --check "$f"; done
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f"
            deno check "$f"
          done
